[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cherry-mail-memory"
version = "0.1.0"
description = "Cross-platform Gmail archive, search, and local-AI RAG memory desktop app"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "paddman" }]
dependencies = [
  "PySide6>=6.7,<7",
  "google-api-python-client>=2.130,<3",
  "google-auth>=2.29,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "platformdirs>=4.2,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "pyinstaller>=6.10,<7",
]

[project.scripts]
cherry-mail-memory = "cherry_mail_memory.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
