name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CherryMailMemory-Windows
          - os: ubuntu-22.04
            artifact: CherryMailMemory-Linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: python -m ruff check src tests

      - name: Build
        run: pyinstaller --noconfirm --clean CherryMailMemory.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/CherryMailMemory/
          if-no-files-found: error
          retention-days: 14
