name: Bootstrap source and build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore source archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin bootstrap-source
          : > /tmp/cherry-source.tar.gz.b64
          while IFS= read -r path; do
            git show "origin/bootstrap-source:${path}" >> /tmp/cherry-source.tar.gz.b64
          done < <(git ls-tree -r --name-only origin/bootstrap-source bootstrap | sort)
          base64 --decode /tmp/cherry-source.tar.gz.b64 > /tmp/cherry-source.tar.gz
          echo "deae849d1474e21bd03d27c3024bf38f19f5d28e69eb43c8702473759a3e723e  /tmp/cherry-source.tar.gz" | sha256sum --check
          tar -xzf /tmp/cherry-source.tar.gz -C .
          rm -f .github/workflows/build.yml
          python -m compileall -q src

      - name: Commit application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Cherry Mail Memory desktop app"
          git push origin HEAD:main
          git push origin --delete bootstrap-source || true

  build:
    needs: materialize
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CherryMailMemory-Windows
          - os: ubuntu-22.04
            artifact: CherryMailMemory-Linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest

      - name: Lint
        run: python -m ruff check src tests

      - name: Build
        run: pyinstaller --noconfirm --clean CherryMailMemory.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/CherryMailMemory/
          if-no-files-found: error
          retention-days: 14
